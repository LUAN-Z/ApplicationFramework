name: Build with Nuitka

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.0"

          "version=$version" >> $env:GITHUB_OUTPUT
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Build version: $version"

      - name: Build executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: ApplicationFramework.py
          mode: standalone
          enable-plugins: pyqt5
          include-package: |
            qfluentwidgets
            qfluentwidgets._rc
            plugins.cmd_executor
            plugins.config_viewer
            plugins.file_replacer
            plugins.json_viewer
            plugins.log_excel_import
            plugins.plugin_scaffolder
            plugins.pomodoro
            plugins.time_log
            plugins.todo
          include-qt-plugins: platforms,styles,imageformats,iconengines
          include-data-files: |
            config/plugins.json=config/plugins.json
            APPLICATIONS.ico=APPLICATIONS.ico
          windows-icon-from-ico: APPLICATIONS.ico
          windows-console-mode: disable
          force-stderr-spec: "{PROGRAM_BASE}.err.txt"
          product-name: ApplicationFramework
          file-description: ApplicationFramework
          product-version: ${{ steps.version.outputs.version }}
          file-version: ${{ steps.version.outputs.version }}
          assume-yes-for-downloads: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApplicationFramework-${{ steps.version.outputs.version }}-windows
          path: build/ApplicationFramework.dist/**
          include-hidden-files: true
